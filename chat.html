<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Живой Чат</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
        .msg { margin-bottom: 6px; }
        input { padding: 8px; margin-right: 5px; }
        button { padding: 8px 14px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>💬 Живой чат поддержки</h2>
    <div>
        <input type="text" id="username" placeholder="Ваше имя (например, Алиса)">
        <button onclick="connect()">Подключиться</button>
    </div>
    <br>
    <div id="chat"></div>
    <div>
        <input type="text" id="msgInput" placeholder="Сообщение..." style="width: 70%;" disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Отправить</button>
    </div>
    <script>
        let ws;
        function connect() {
            const name = document.getElementById("username").value;
            if (!name) return alert("Введите имя!");

            // Подключаемся по протоколу ws://
            ws = new WebSocket(`ws://127.0.0.1/api/v1/chat/ws/${name}`);

            ws.onmessage = function(event) {
                const chat = document.getElementById("chat");
                chat.innerHTML += `<div class="msg">${event.data}</div>`;
                chat.scrollTop = chat.scrollHeight;
            };
            ws.onopen = function() {
                document.getElementById("username").disabled = true;
                document.getElementById("msgInput").disabled = false;
                document.getElementById("sendBtn").disabled = false;
            };
        }
        function sendMessage() {
            const input = document.getElementById("msgInput");
            if (input.value) {
                ws.send(input.value);
                input.value = "";
            }
        }
    </script>
</body>
</html>
