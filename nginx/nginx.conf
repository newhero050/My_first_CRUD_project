upstream fastapi_app {
    server web:8000;
}

# 1. Блок HTTP (Порт 80): перенаправляет всех на HTTPS
server {
    listen 80;
    server_name ruslan-market.shop www.ruslan-market.shop;

    # Оставляем этот путь для будущего автоматического продления сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы принудительно отправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Блок HTTPS (Порт 443): защищенный сайт с шифрованием
server {
    listen 443 ssl;
    server_name ruslan-market.shop www.ruslan-market.shop;

    client_max_body_size 20M;

    # Пути к нашим свежим сертификатам от Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/ruslan-market.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruslan-market.shop/privkey.pem;

    # Современные стандарты безопасности шифрования
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}